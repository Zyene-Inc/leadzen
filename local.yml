# local.yml — the bounded CLI service described in docs/docker.md.
# Keep this filename for existing operator commands and Makefile targets.
#
# For development, install the package instead: `uv pip install -e ".[dev]"`.

services:
  app:
    build:
      context: .
      dockerfile: ./compose/leadzen/Dockerfile
    # A bounded discovery pass must never be restarted into repeated paid work.
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      # Only the CRM is mounted — the code is what the image was built from, so
      # moving an instance forward is `git pull` + rebuild, never a live edit.
      - ./data:/app/data
