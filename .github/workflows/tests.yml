name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/release-security.yml

  browser:
    uses: ./.github/workflows/browser-regression.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.15"

      - name: Install
        run: |
          uv pip install --system --require-hashes -r requirements-build.lock
          uv pip install --system --require-hashes -r requirements-production.lock
          uv pip install --system --no-build-isolation ".[dev,web]"

      - name: Dependency advisories
        run: |
          uvx pip-audit -r requirements-production.lock --no-deps --disable-pip
          uvx pip-audit -r requirements-build.lock --no-deps --disable-pip

      - name: Python syntax and undefined names
        run: uvx ruff==0.16.10 check leadzen tests --select F821,F822,F823,E9

      - name: Run tests
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Dependency advisories
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Verify controls
        run: npm test -- --maxWorkers=2
      - name: Production build
        run: npm run build

  build:
    if: github.event_name != 'pull_request'
    needs: [test, dashboard, security, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.15"
      - name: Build Python distribution
        run: uv build --build-constraints requirements-build.lock --require-hashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leadzen-distribution
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-candidate-image
          path: candidate-image/
      - name: Verify the exact scanned image
        working-directory: candidate-image
        run: sha256sum --check candidate-image.tar.gz.sha256
